<!doctype html>

<head>
<meta charset="UTF-8" />

<title>模块详情 — 灯塔功能价值汇报</title>

<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/module.css" />
<link rel="stylesheet" href="assets/css/print.css" media="print" />
</head>
<body data-page="module">

<!-- ======================= 顶栏 ======================= -->
<nav class="top" aria-label="顶部导航">
  <div class="wrap">
    <a class="brand" href="index.html"><i aria-hidden="true"></i>灯塔 · 功能价值汇报<small>模块详情</small></a>
    <span class="top-sp"></span>
    <button type="button" class="btn" id="btnPrint" title="打印 / 导出本页 PDF">打印/PDF</button>
    <button type="button" class="btn" id="btnFull" title="全屏演示（Esc 退出）">全屏</button>
    <a class="btn pri" href="index.html">返回架构总览</a>
  </div>
</nav>

<!-- ======================= 模块快速导航 ======================= -->
<nav class="modnav" aria-label="模块快速导航">
  <div class="wrap">
    <span class="lbl">25 个模块</span>
    <div class="strip" id="modStrip"></div>
  </div>
</nav>

<main class="wrap mod" id="modMain"></main>

<!-- ======================= 效果图灯箱 ======================= -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="效果图放大查看">
  <div class="lb-box">
    <div class="lb-art" id="lbArt"></div>
    <div class="lb-cap"><h3 id="lbTitle"></h3><span class="idx" id="lbIdx"></span></div>
    <div class="lb-bar">
      <button type="button" class="btn sm" id="lbPrev">← 上一张</button>
      <button type="button" class="btn sm" id="lbNext">下一张 →</button>
      <button type="button" class="btn sm" id="lbVer2">新版页面</button>
      <button type="button" class="btn sm" id="lbVer1">旧版页面</button>
      <button type="button" class="btn sm" id="lbMod">查看模块详情 →</button>
      <button type="button" class="btn sm" id="lbClose">关闭（Esc）</button>
    </div>
    <p class="tip">放大后可用滚轮继续缩放，双击还原；← / → 在有截图的模块之间翻页。</p>
  </div>
</div>

<!-- ======================= 浮层 ======================= -->
<div id="nodeTip" aria-hidden="true"></div>
<div id="hoverPrev" aria-hidden="true"><img alt="" /></div>
<button type="button" id="toTop" aria-label="回到顶部" title="回到顶部">↑</button>

<script src="assets/js/data.js"></script>
