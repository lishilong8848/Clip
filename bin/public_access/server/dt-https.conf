limit_conn_zone $server_name zone=clipflow_public_dt_total:1m;

server {
    listen 80;
    server_name dt.sjhl.online;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/clipflow-public/wwwroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://dt.sjhl.online$request_uri; }
}

server {
    listen 443 ssl;
    server_name dt.sjhl.online;
    ssl_certificate /opt/clipflow-public/tls/dt/fullchain.pem;
    ssl_certificate_key /opt/clipflow-public/tls/dt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:clipflow_public_dt_tls:1m;
    ssl_session_timeout 10m;
    access_log off;
    error_log /var/log/nginx-clipflow-public.error.log crit;
    client_max_body_size 301m;
    client_body_timeout 60s;
    limit_conn clipflow_public_dt_total 32;
    limit_conn_status 503;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location = /.well-known/clipflow-certificate.json {
        include /opt/clipflow-public/status/access.conf;
        alias /opt/clipflow-public/status/certificate.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:6100;
        proxy_http_version 1.1;
        proxy_set_header Host dt.sjhl.online;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }
}
