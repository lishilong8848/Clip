server {
    listen 80;
    server_name dengta.sjhl.online;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/clipflow-public/wwwroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://dt.sjhl.online$request_uri; }
}

server {
    listen 443 ssl;
    server_name dengta.sjhl.online;
    ssl_certificate /opt/clipflow-public/tls/fullchain.pem;
    ssl_certificate_key /opt/clipflow-public/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / { return 308 https://dt.sjhl.online$request_uri; }
}
