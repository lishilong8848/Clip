<section class="serenity-desk entry-desk" :class="{'session-entry':!checking&&!loggedIn}" aria-label="账号办理">
  <p v-if="checking" role="status">正在检查登录状态…</p>
  <template v-else-if="!loggedIn">
    <div class="entry-signin" data-v2-inline-feedback>
      <header class="entry-heading">
        <span class="entry-security"><ShieldCheck :size="24" aria-hidden="true"/></span>
        <h1>统一登录</h1>
        <p>请选择一种方式登录</p>
      </header>
      <div class="entry-methods" role="tablist" aria-label="登录方式" @keydown="onTabKeydown">
        <button v-for="tab in tabs" :id="'login-tab-'+tab.value" :key="tab.value" role="tab" type="button"
          :aria-controls="'login-panel-'+tab.value" :tabindex="activeTab===tab.value?0:-1" :aria-selected="activeTab===tab.value" @click="selectTab(tab.value)">
          <img v-if="tab.value==='feishu'" :src="feishuLogo" alt="" width="16" height="16"/>{{ tab.entryLabel }}</button>
      </div>
      <div :id="'login-panel-'+activeTab" role="tabpanel" :aria-labelledby="'login-tab-'+activeTab" class="entry-body">
        <div v-if="activeTab==='feishu'" class="entry-choice">
          <p>VNET 人员及固定值班账号请使用飞书授权登录。</p>
          <p v-if="authCancelled" class="entry-cancelled" role="status">已取消飞书授权，可重新登录。</p>
          <div class="entry-method-intro">
            <span class="entry-emblem"><img :src="feishuLogo" alt="" width="42" height="42"/></span>
            <strong>使用飞书账号授权</strong>
          </div>
          <a class="entry-primary feishu-btn" :href="feishuLoginUrl" @click="handleFeishuLogin">飞书授权登录</a>
          <a class="entry-link" href="https://applink.feishu.cn/T9aX3K4ZHOXl" target="_blank" rel="noopener noreferrer">申请飞书应用权限</a>
        </div>
        <PersonnelPasswordLogin v-else-if="activeTab==='password'"/>
        <form v-else class="entry-choice" action="/api/auth/guest" method="post">
          <div class="entry-method-intro">
            <span class="entry-emblem"><Eye :size="34" aria-hidden="true"/></span>
            <p>访客权限仅用于查询机柜信息。</p>
          </div>
          <button class="entry-primary" type="submit">访客登录</button>
        </form>
      </div>
    </div>
  </template>
  <template v-else-if="passwordSettings"><header class="serenity-heading"><h1>修改密码</h1><button type="button" @click="emit('back')">返回个人信息</button></header>
    <PersonnelPasswordLogin initial-mode="change" :person-id="changePersonId" :user-name="changeUserName"/></template>
  <template v-else><header class="serenity-heading"><div><h1>{{ title||'申请楼栋权限' }}</h1><p>{{ userLineText }}</p></div><button v-if="showBack" type="button" @click="emit('back')">返回</button></header>
    <section v-if="request.requestId" class="serenity-panel" role="status"><h2>{{ requestStatusTitle }}</h2><p>{{ requestStatusDescription }}</p>
      <button v-if="request.notificationError" type="button" :disabled="retryingNotification" @click="retryNotification">重试审批提醒</button></section>
    <form class="entry-request" @submit.prevent="emit('submit')">
      <fieldset><legend>申请楼栋</legend><label v-for="scope in requestableScopes" :key="scope.value">
        <input type="checkbox" :checked="request.scopes.includes(scope.value)" @change="toggleScope(scope.value,($event.target as HTMLInputElement).checked)">{{ scope.label }}</label></fieldset>
      <label>审批人<NSelect :value="request.approverOpenId" :options="approvers.map(person=>({label:person.name,value:person.open_id}))" :loading="approversLoading" @update:value="value=>emit('update-request',{approverOpenId:value})" aria-label="审批人"/></label>
      <p v-if="approverError" role="alert">{{ approverError }} <button type="button" @click="loadApprovers">重新读取</button></p>
      <label>申请原因<textarea :value="request.reason" @input="emit('update-request',{reason:($event.target as HTMLTextAreaElement).value})"></textarea></label>
      <p v-if="request.message" role="status">{{ request.message }}</p>
      <button class="entry-primary" type="submit" :disabled="!canSubmit" :title="submitTitle">提交申请</button>
    </form>
  </template>
</section>
