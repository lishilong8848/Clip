<section v-if="open" class="serenity-desk platform-desk admin-shell" aria-label="平台运维">
  <AdminWorkspaceChrome v-if="systemAdmin" :tabs="adminTabs" :active-tab="tab" :advanced-visible="advancedDiagnosticsVisible" @select-tab="selectAdminTab"/>
  <header v-else class="serenity-heading"><h1>账号与权限</h1><button type="button" @click="closeAdmin">返回个人信息</button></header>
  <MessageBanner v-if="message" :text="message"/>
  <AdminAccounts v-if="tab==='permissions'||!systemAdmin" :pending-count="systemAdmin?pendingPermissionRequestCount:0" :permissions="systemAdmin?permissions.users:[]"/>
  <template v-else-if="tab==='status'"><p v-if="statusUnavailable" role="alert">{{ statusUnavailable }}</p>
    <AdminStatusPane :stats="stats" :perf="perf" :queues="queues" :consistency="consistency" :busy="busy||statusLoading" :recent-jobs="recentJobs" :operation-audits="operationAudits"
      :notice-diagnostic="noticeDiagnostic" :notice-diagnostic-loading="noticeDiagnosticLoading" v-model:notice-diagnostic-query="noticeDiagnosticQuery"
      @refresh="loadStatus" @run-notice-diagnostic="runNoticeDiagnostic" @repair-notice-projection="repairNoticeProjection" @preflight="runPreflight" @cleanup="cleanupJobs"
      @open-history-memory="openHistoryMemory" @retry-job="retryJob" @clear-job="clearJob" @mark-stuck-failed="markStuckFailed"/></template>
  <AdminHandoverPane v-else-if="tab==='handover'" :building-scopes="buildingScopes" :links="handoverLinks" :password="handoverPassword" :busy="busy"
    @update-link="updateHandoverLink" @update-password="updateHandoverPassword" @refresh="loadHandover" @save="saveHandover"/>
  <AdminMopSettingsPane v-else-if="tab==='mop'" :settings="mopSettings" :busy="busy" @update-field="updateMopSettingField" @refresh="loadMopSettings" @save="saveMopSettings"/>
  <FeishuAssistantSettings v-else-if="tab==='feishu'"/><DingTalkNoticeSettings v-else-if="tab==='dingtalk'" ref="dingTalkSettings"/>
  <ReleaseJournalPage v-else-if="tab==='development'"/><AdminPressurePane v-else-if="tab==='pressure'" :pressure="pressure" :pressure-result="pressureResult" :busy="busy" @update-pressure="updatePressureField" @run="runMockPressure"/>
  <ConfirmDialog :open="confirmDialog.open" :tone="confirmDialog.tone" :title="confirmDialog.title" :kicker="confirmDialog.kicker" :message="confirmDialog.message"
    :details="confirmDialog.details" :confirm-label="confirmDialog.confirmLabel" :cancel-label="confirmDialog.cancelLabel" :confirm-class="confirmDialog.confirmClass" @resolve="resolveConfirm"/>
</section>
