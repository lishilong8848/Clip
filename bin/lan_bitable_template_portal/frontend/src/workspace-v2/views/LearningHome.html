<LearningPersonalHome v-if="!management" :data="data" :person="person" :loading="loading" :failed="failed" :daily-duty="dailyDuty" @open="emit('open', $event)" @refresh="emit('refresh')" />
<section v-else class="lp-hub" aria-label="学习管理工作台">
  <section class="lp-panel lp-agenda">
    <header class="lp-heading"><h2>当班学习进度</h2><small>{{ date }}</small></header>
    <p v-if="failed" class="lp-msg error">进度暂未读取 <button class="lp-btn" @click="emit('refresh')">重试</button></p>
    <p v-else-if="loading" class="lp-msg" role="status">正在读取当日进度…</p>
    <template v-else>
      <div class="lp-progress-line"><strong>{{ metric(data.today_summary?.task_answered) }} <small>/ {{ metric(data.today_summary?.assigned) }} 题</small></strong>
        <progress v-if="total > 0" :value="answered" :max="total" aria-label="当班题单进度"></progress>
        <span v-if="exemptionDate">新人免答至 {{ exemptionDate }} 恢复</span><span v-else-if="data.today_summary?.has_uncertain_tasks">当班进度待核对</span><span v-else>{{ total ? completed ? '当日题目已答完' : '待作答 ' + Math.max(0,total-answered) + ' 题' : '暂无已领取题目' }}</span>
      </div>
      <ul v-if="selfProgress?.tasks?.length" class="lp-shifts"><li v-for="(task,i) in selfProgress.tasks" :key="i">{{ task.shift || '当班' }}班 · {{ task.label || task.status || task.state }}</li></ul>
    </template>
  </section>
</section>
