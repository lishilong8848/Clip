<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>告警扫码中转</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; color: #172b46; background: #f1f5f9; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 18px; line-height: 1.65; }
    main { max-width: 620px; margin: 5vh auto; padding: 30px; background: white; border: 1px solid #dce4ed; border-radius: 16px; }
    .eyebrow { color: #375a7f; font-size: 14px; margin: 0; }
    h1 { font-size: 26px; margin: 8px 0 22px; line-height: 1.4; }
    #status { border-left: 4px solid #2563eb; padding: 12px 16px; background: #eff6ff; }
    #status.error { border-color: #c2410c; background: #fff7ed; }
    .muted { color: #52647c; font-size: 14px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 20px 0; max-height: 42vh; overflow: auto; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    a, button { min-height: 46px; padding: 11px 18px; border: 1px solid #c8d5e4; border-radius: 8px; font: inherit; background: white; color: #24405f; text-decoration: none; cursor: pointer; }
    a.primary { background: #1d4ed8; color: white; border-color: #1d4ed8; }
    :focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    [hidden] { display: none !important; }
    button:disabled { opacity: .6; cursor: wait; }
    @media (max-width: 480px) { body { padding: 16px 12px; } main { margin: 12px auto; padding: 22px 18px; } h1 { font-size: 23px; } .actions > * { text-align: center; width: 100%; } }
  </style>
</head>
<body data-dingtalk-managed="false">
<main>
  <p class="eyebrow">扫码数据中转</p>
  <h1>正在提交告警</h1>
  <p id="status" role="status" aria-live="polite">正在读取二维码内容…</p>
  <p class="muted" id="hint">本地接收后，将自动打开原有扫码网页。</p>
  <pre id="content" aria-label="告警内容"></pre>
  <div class="actions">
    <a class="primary" id="continue" hidden rel="noreferrer">打开原网页</a>
    <button id="retry" hidden>重试提交</button>
    <button id="stay" hidden>停留查看</button>
  </div>
</main>
<script>
  const PUBLIC_PAGE = 'https://lishilong8848.github.io/NanTongJiFangDianChi/copy.html';
  const LEGACY_PAGE = 'https://lsldiyige-sys.github.io/ntsjhl/copy.html';
  const params = new URLSearchParams(location.search);
  const DINGTALK_MANAGED = document.body.dataset.dingtalkManaged === 'true';
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const retryBtn = document.getElementById('retry');
  const continueLink = document.getElementById('continue');
  const stayBtn = document.getElementById('stay');
  let payload, redirectTimer, busy = false;

  function scheduleNext(delay) {
    stayBtn.hidden = false;
    redirectTimer = setTimeout(() => location.replace(continueLink.href), delay);
  }

  async function submit() {
    if (busy) return;
    clearTimeout(redirectTimer);
    stayBtn.hidden = true;
    busy = true;
    retryBtn.disabled = true;
    retryBtn.hidden = true;
    statusEl.classList.remove('error');
    statusEl.textContent = '正在提交到本地服务…';
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);
    try {
      const response = await fetch('/api/alarm-scan/events', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload), signal: controller.signal, keepalive: true
      });
      const result = await response.json();
      if (!response.ok || !['accepted', 'duplicate'].includes(result.status)) {
        throw new Error('本地接收未确认');
      }
      document.querySelector('h1').textContent = '本地已接收';
      const feishu = result.feishu && result.feishu.status;
      const ding = result.dingtalk && result.dingtalk.status;
      if (result.dingtalk_managed) {
        const target = new URL(continueLink.href);
        target.searchParams.delete('webhook');
        continueLink.href = target.href;
      }
      const label = (name, status) => ({sent:name + '已发送', duplicate:name + '此前已发送', disabled:name + '未启用', failed:name + '发送未确认'})[status] || name + '状态未知';
      const channels = result.dingtalk_managed ? label('钉钉', ding) + '；' + label('飞书', feishu) : label('飞书', feishu);
      if (feishu === 'failed' || ding === 'failed') {
        statusEl.textContent = '本地已接收；' + channels + '。可重试，已成功的通道会去重。';
        statusEl.classList.add('error');
        retryBtn.hidden = false;
        hintEl.textContent = '5 秒后仍将打开原网页。点击“停留查看”可暂停并重试。';
        scheduleNext(5000);
      } else {
        statusEl.textContent = '本地已接收；' + channels + '。';
        hintEl.textContent = '即将打开原网页，告警内容会一并带入。';
        scheduleNext(1800);
      }
    } catch (error) {
      document.querySelector('h1').textContent = '本地提交未确认';
      statusEl.classList.add('error');
      statusEl.textContent = '请检查本地服务是否在线。可以重试，或先打开原网页。';
      hintEl.textContent = '5 秒后仍将打开原网页。点击“停留查看”可暂停并重试。';
      retryBtn.hidden = false;
      scheduleNext(5000);
    } finally {
      clearTimeout(timeout);
      retryBtn.disabled = false;
      busy = false;
    }
  }

  function init() {
    try {
      const target = params.get('target') || PUBLIC_PAGE;
      if (![PUBLIC_PAGE, LEGACY_PAGE].includes(target)) throw new Error('原网页地址不受支持');
      if (!location.hash.startsWith('#b64:')) throw new Error('二维码缺少告警内容');
      let encoded = location.hash.slice(5).replace(/-/g, '+').replace(/_/g, '/');
      encoded += '='.repeat((4 - encoded.length % 4) % 4);
      const bytes = Uint8Array.from(atob(encoded), char => char.charCodeAt(0));
      const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      if (!text.trim() || text.length > 12000) throw new Error('告警内容为空或过长');
      const next = new URL(target);
      if (params.get('l_hao')) next.searchParams.set('l_hao', params.get('l_hao'));
      if (!DINGTALK_MANAGED && target === LEGACY_PAGE && params.get('webhook')) next.searchParams.set('webhook', params.get('webhook'));
      next.hash = location.hash;
      continueLink.href = next.href;
      continueLink.hidden = false;
      document.getElementById('content').textContent = text;
      payload = { louhao: params.get('l_hao') || '', content: text, ts: Date.now(), signature: params.get('sig') || '' };
      submit();
    } catch (error) {
      document.querySelector('h1').textContent = '二维码无效';
      statusEl.textContent = error.message;
      statusEl.classList.add('error');
      hintEl.textContent = '请重新生成二维码。';
    }
  }
  retryBtn.addEventListener('click', submit);
  stayBtn.addEventListener('click', () => {
    clearTimeout(redirectTimer);
    stayBtn.hidden = true;
    hintEl.textContent = '已暂停自动跳转，可手动打开原网页。';
  });
  init();
</script>
</body>
</html>
